<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>タスクハブ｜会社用の画面へ</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@500;700&family=Noto+Sans+JP:wght@400;500;700&display=swap">
<style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px;background:#FAFAF6;color:#2A2A24;font-family:'Noto Sans JP','Zen Kaku Gothic New',system-ui,sans-serif}
main{width:100%;max-width:600px;padding:clamp(24px,6vw,48px);background:#fff;border:1px solid #E2DCC9;border-radius:18px;box-shadow:0 4px 14px rgba(30,26,16,.05)}.label{color:#2E5C4E;font-weight:700;letter-spacing:.12em}h1{font-family:'Zen Kaku Gothic New',sans-serif;font-size:clamp(23px,5vw,32px);line-height:1.6}p{line-height:1.9}a{display:block;margin-top:28px;padding:16px;background:#2E5C4E;color:#fff;text-align:center;text-decoration:none;border-radius:10px;font-weight:700}a:hover{background:#23483d}a:focus-visible{outline:3px solid #B4741E;outline-offset:4px}.note{color:#7A7365;font-size:14px}
</style>
</head>
<body><main><p class="label">タスクハブ</p><h1>タスクハブは会社用の画面に移りました</h1><p>これからは、会社のグーグルアカウントで下のボタンから開いてください。</p><a href="https://script.google.com/a/macros/gws.healthy-home.co.jp/s/AKfycbwS8g7ZC5Y5rH31Ge7Zn2Xfrl8xpS6msIAZ6UAJGPd7Zl_Tgw31SYeOxundOTlmG1gC/exec">会社用のタスクハブを開く</a><p class="note">新しい画面を開いたら、ブックマークも変更してください。</p></main></body>
</html>
