<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>広報室プロジェクト</title>
<style>
:root{--bg:#f6f5f1;--surface:#fff;--text:#302e28;--muted:#746e62;--border:#e5e1d7;--accent:#736342}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:15px/1.6 "Yu Gothic UI","Meiryo",sans-serif}main{max-width:1200px;margin:auto;padding:28px 24px 60px}h1{font-size:27px;margin:0}p{margin:8px 0}.sub,small{color:var(--muted)}header{margin-bottom:24px}.toolbar{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-top:18px}button,input,select,textarea{font:inherit}button,.link{border:1px solid var(--border);background:white;border-radius:9px;padding:8px 13px;color:var(--text);cursor:pointer;text-decoration:none}button:hover,.link:hover{background:#f0ede5}button:disabled{opacity:.55;cursor:wait}.primary{background:var(--accent);color:white}.primary:hover{background:#5e5036}select,input,textarea{border:1px solid var(--border);padding:9px;border-radius:8px;background:white;max-width:100%}a{color:var(--accent)}details{border:1px solid var(--border);border-radius:15px;background:white;margin:15px 0;overflow:hidden;box-shadow:0 2px 8px #302e2805}summary{cursor:pointer;padding:19px 20px;background:#fffdf8}summary h2{display:inline;font-size:19px;overflow-wrap:anywhere}.summary-meta{display:flex;gap:10px 20px;flex-wrap:wrap;color:var(--muted);font-size:13px;margin:7px 0 0 20px}.body{padding:0 20px 20px}.project-note,.note{white-space:pre-wrap;overflow-wrap:anywhere}.project-note{color:var(--muted);margin:12px 0}.actions{display:flex;gap:8px;flex-wrap:wrap;margin:14px 0}.danger{color:#a44435}.task{display:grid;grid-template-columns:24px minmax(160px,1.5fr) minmax(180px,1fr) 105px auto;gap:12px;align-items:start;border-top:1px solid var(--border);padding:16px 0}.task input{margin-top:6px;width:19px;height:19px}.title{font-weight:700;overflow-wrap:anywhere}.done .title{text-decoration:line-through;color:var(--muted)}.note{font-size:13px;color:var(--muted);margin-top:5px}.badge{display:inline-block;border-radius:6px;font-size:13px;padding:3px 9px;overflow-wrap:anywhere;background:#e7efe9;color:#365e45}.badge.client{background:#fff0d9;color:#825e22}.badge.other{background:#ede8f6;color:#685382}.owner-hint{display:block;font-size:11px;margin-top:5px}.date{font-size:13px}.row-actions{display:flex;gap:6px}.row-actions button{padding:4px 9px;font-size:13px}.empty{padding:18px;color:var(--muted)}#status{white-space:pre-wrap;overflow-wrap:anywhere}#status.error{color:#a13b2e}dialog{border:1px solid var(--border);border-radius:16px;max-width:560px;width:calc(100% - 28px);max-height:90vh;padding:24px;color:var(--text)}dialog::backdrop{background:#29261f66}dialog h2{margin:0 0 16px;font-size:20px}form label.field{display:block;margin:12px 0}form label.field>input,form label.field>select,textarea{display:block;width:100%;margin-top:4px}textarea{min-height:95px;resize:vertical}.two{display:grid;grid-template-columns:1fr 1fr;gap:14px}.form-error{color:#a13b2e;white-space:pre-wrap}.legend{font-size:12px;display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}[hidden]{display:none!important}:focus-visible{outline:3px solid #b8a477;outline-offset:3px}
@media(max-width:650px){main{padding:18px 12px}h1{font-size:23px}.toolbar{gap:8px}.toolbar button,.toolbar .link{padding:8px 10px;font-size:13px}.body{padding:0 13px 14px}summary{padding:16px 13px}.task{grid-template-columns:24px minmax(0,1fr);gap:7px 10px}.task .assignment,.task .date,.task .row-actions{grid-column:2}.summary-meta{gap:4px 12px}.two{grid-template-columns:1fr;gap:0}dialog{padding:18px}}
</style>
</head>
<body><main>
<header><h1>広報室プロジェクト</h1><p class="sub">担当と進み具合を、広報室のみんなで共有</p>
<div class="toolbar"><button id="openAll">全部開く</button><button id="closeAll">全部閉じる</button><button id="newProject" class="primary" disabled>＋ 新しいプロジェクト</button><a id="back" class="link" target="_blank" rel="noopener" hidden>タスクハブへ戻る</a></div>
<div class="toolbar"><label>担当者 <select id="filter"><option value="">全員</option></select></label><label><input id="hideDone" type="checkbox"> 完了を隠す</label><button id="reload">読み直す</button></div>
<div class="legend"><span class="badge">メンバー</span><span class="badge client">先方</span><span class="badge other">その他</span></div>
</header>
<p id="status" role="status">読み込んでいます…</p><section id="projects" aria-label="プロジェクト一覧"></section>
</main>
<dialog id="editor"><form id="editForm"><h2 id="editTitle"></h2><div id="fields"></div><p class="form-error" id="formError" role="alert"></p><div class="actions"><button type="submit" class="primary" id="save">保存</button><button type="button" id="cancel">キャンセル</button></div></form></dialog>
<script>
(function(){
'use strict';
const $=id=>document.getElementById(id);
const esc=v=>String(v==null?'':v).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let data={projects:{},tasks:{},members:[],version:0}, opened={}, edit=null, busy=false, loading=false;
try{opened=JSON.parse(localStorage.getItem('kouhou.open')||'{}')||{};}catch(e){}
function remember(){try{localStorage.setItem('kouhou.open',JSON.stringify(opened));}catch(e){}}
function call(action,req){return new Promise((resolve,reject)=>{
  if(!(window.google&&google.script&&google.script.run)){reject(new Error('試しページを作る仕組みから開いてください'));return;}
  google.script.run.withSuccessHandler(r=>r&&r.ok?resolve(r):reject(new Error(r&&r.error||'読み込めませんでした'))).withFailureHandler(reject).kp(action,req||{});
});}
function status(text,error){$('status').textContent=text;$('status').className=error?'error':'';}
function options(selected){return data.members.map(m=>'<option value="'+esc(m.email)+'" '+(m.email===selected?'selected':'')+'>'+esc(m.name)+'</option>').join('');}
function render(){
  const filter=$('filter').value, hide=$('hideDone').checked;
  const projects=Object.entries(data.projects).sort((a,b)=>(a[1].order||0)-(b[1].order||0));
  $('projects').innerHTML=projects.map(([id,p])=>{
    const all=Object.entries(data.tasks).filter(([,t])=>t.kouhouProjectId===id).sort((a,b)=>(a[1].order||0)-(b[1].order||0));
    const shown=all.filter(([,t])=>(!hide||!t.completed)&&(!filter||(t.assigneeType==='member'?t.assigneeEmail:t.assigneeType)===filter));
    const due=all.map(([,t])=>!t.completed&&t.dueDate||'').filter(Boolean).sort()[0];
    return '<details data-project="'+esc(id)+'" '+(opened[id]===false?'':'open')+'><summary><h2>'+esc(p.name)+'</h2><div class="summary-meta">'+(p.client?'<span>先方：'+esc(p.client)+'</span>':'')+'<span>リーダー：'+esc(p.leaderName)+'</span><span>完了 '+all.filter(([,t])=>t.completed).length+'／'+all.length+'</span><span>直近の期限：'+esc(due||'なし')+'</span></div></summary><div class="body">'+(p.notes?'<p class="project-note">'+esc(p.notes)+'</p>':'')+'<div class="actions"><button data-act="addTask" data-id="'+esc(id)+'">＋ タスクを追加</button><button data-act="editProject" data-id="'+esc(id)+'">プロジェクトを編集</button><button class="danger" data-act="deleteProject" data-id="'+esc(id)+'">削除</button></div>'+shown.map(([tid,t])=>'<div class="task '+(t.completed?'done':'')+'"><input type="checkbox" data-toggle="'+esc(tid)+'" aria-label="'+esc(t.title)+'を完了にする" '+(t.completed?'checked':'')+'><div><div class="title">'+esc(t.title)+'</div>'+(t.notes?'<div class="note">'+esc(t.notes)+'</div>':'')+'</div><div class="assignment"><span class="badge '+(t.assigneeType==='client'?'client':t.assigneeType==='other'?'other':'')+'">'+esc(t.assigneeType==='client'?'先方：'+t.assigneeName:t.assigneeName)+'</span>'+(t.assigneeType!=='member'?'<small class="owner-hint">リーダー'+esc(p.leaderName)+'さんのタスクハブに入ります</small>':'')+'</div><div class="date">期限 '+esc(t.dueDate||'なし')+(t.startDate?'<br><small>開始 '+esc(t.startDate)+'</small>':'')+'</div><div class="row-actions"><button data-act="editTask" data-id="'+esc(tid)+'">編集</button><button class="danger" data-act="deleteTask" data-id="'+esc(tid)+'">削除</button></div></div>').join('')+(!shown.length?'<p class="empty">'+(all.length?'絞り込みに合うタスクはありません':'タスクはまだありません')+'</p>':'')+'</div></details>';
  }).join('')||'<p class="empty">「＋ 新しいプロジェクト」から始めてください。</p>';
  $('projects').querySelectorAll('details').forEach(el=>el.addEventListener('toggle',()=>{opened[el.dataset.project]=el.open;remember();}));
  $('projects').querySelectorAll('button,input').forEach(el=>el.disabled=busy);
}
async function load(changes){
  if(loading || (changes&&(busy||$('editor').open||document.hidden)))return;
  loading=true;
  try{
    const r=await call(changes?'changes':'load',{since:data.version});
    if(r.changed!==false){data=r;const selected=$('filter').value;$('filter').innerHTML='<option value="">全員</option>'+options(selected)+'<option value="client">先方</option><option value="other">その他</option>';$('filter').value=selected;$('back').href=r.taskhubUrl;$('back').hidden=!r.taskhubUrl;render();}
    $('newProject').disabled=busy;status('45秒ごとに更新します。');
  }catch(e){status(e.message||String(e),true);}finally{loading=false;}
}
function field(label,id,value,type){return '<label class="field">'+label+'<input id="'+id+'" type="'+(type||'text')+'" value="'+esc(value||'')+'" '+(id==='name'||id==='title'?'required':'')+' maxlength="'+(id==='title'?500:120)+'"></label>';}
function notes(value){return '<label class="field">メモ<textarea id="notes" maxlength="10000">'+esc(value||'')+'</textarea></label>';}
function openEditor(kind,id,pid){
  if(busy)return;
  edit={kind,id,pid};$('formError').textContent='';
  if(kind==='project'){
    const p=data.projects[id]||{};$('editTitle').textContent=id?'プロジェクトを編集':'新しいプロジェクト';
    $('fields').innerHTML=field('プロジェクト名','name',p.name)+field('先方（会社名など・空でもよい）','client',p.client)+'<label class="field">リーダー<select id="leader" required>'+options(p.leader||data.me)+'</select></label>'+notes(p.notes);
  }else{
    const t=data.tasks[id]||{},p=data.projects[pid];$('editTitle').textContent=id?'タスクを編集':'タスクを追加';
    $('fields').innerHTML=field('題名','title',t.title)+'<label class="field">担当<select id="assignee" required>'+options(t.assigneeEmail||data.me)+'<option value="client">先方</option><option value="other">その他（名前を入れる）</option></select></label><div id="nameBox">'+field('担当の名前','assigneeName',t.assigneeName)+'</div><p id="assigneeHint" class="sub"></p><div class="two">'+field('開始日','startDate',t.startDate,'date')+field('期限','dueDate',t.dueDate,'date')+'</div>'+notes(t.notes);
    if(t.assigneeType&&t.assigneeType!=='member')$('assignee').value=t.assigneeType;
    $('assignee').onchange=assignment;assignment();
  }
  $('editor').showModal();
}
function assignment(){const a=$('assignee').value,p=data.projects[edit.pid],external=a==='client'||a==='other',need=a==='other'||(a==='client'&&!p.client);$('nameBox').hidden=!need;$('assigneeName').required=need;$('assigneeHint').textContent=external?(a==='client'&&p.client?'先方：'+p.client+'。':'')+'リーダー'+p.leaderName+'さんのタスクハブに入ります':'選んだメンバーのタスクハブに入ります';}
async function mutate(action,req){
  if(busy)return false;
  busy=true;$('save').disabled=true;$('cancel').disabled=true;$('newProject').disabled=true;render();
  try{await call(action,req);return true;}catch(e){if($('editor').open)$('formError').textContent=e.message||String(e);else status(e.message||String(e),true);return false;}
  finally{busy=false;$('save').disabled=false;$('cancel').disabled=false;$('newProject').disabled=false;render();}
}
$('editForm').onsubmit=async e=>{
  e.preventDefault();if(busy)return;
  let value,action;
  if(edit.kind==='project'){action='saveProject';value={name:$('name').value,client:$('client').value,leader:$('leader').value,notes:$('notes').value};}
  else{action='saveTask';const a=$('assignee').value;value={title:$('title').value,kouhouProjectId:edit.pid,assigneeType:a==='client'||a==='other'?a:'member',assigneeEmail:a,assigneeName:$('assigneeName').value,startDate:$('startDate').value,dueDate:$('dueDate').value,notes:$('notes').value};if(value.startDate&&value.dueDate&&value.startDate>value.dueDate){$('formError').textContent='開始日が期限より後になっています';return;}}
  if(await mutate(action,{id:edit.id,value})){if(!edit.id&&edit.pid)opened[edit.pid]=true;$('editor').close();await load(false);}
};
$('cancel').onclick=()=>{if(!busy)$('editor').close();};$('editor').addEventListener('cancel',e=>{if(busy)e.preventDefault();});
$('newProject').onclick=()=>openEditor('project','');
$('projects').onclick=async e=>{
  const b=e.target.closest('button[data-act]');if(!b||busy)return;const id=b.dataset.id,a=b.dataset.act;
  if(a==='addTask')openEditor('task','',id);
  if(a==='editTask')openEditor('task',id,data.tasks[id].kouhouProjectId);
  if(a==='editProject')openEditor('project',id);
  if(a==='deleteTask'||a==='deleteProject'){if(confirm(a==='deleteProject'?'このプロジェクトと中のタスクをすべて削除しますか？':'このタスクを削除しますか？')){if(await mutate(a,{id}))await load(false);}}
};
$('projects').onchange=async e=>{const id=e.target.dataset.toggle;if(!id||busy)return;const done=e.target.checked;if(await mutate('toggleTask',{id,done}))await load(false);};
['filter','hideDone'].forEach(id=>$(id).onchange=render);
function all(open){Object.keys(data.projects).forEach(id=>opened[id]=open);remember();render();}
$('openAll').onclick=()=>all(true);$('closeAll').onclick=()=>all(false);$('reload').onclick=()=>{if(!busy&&!$('editor').open)load(false);};
load(false);setInterval(()=>load(true),45000);document.addEventListener('visibilitychange',()=>{if(!document.hidden)load(true);});
})();
</script>
</body></html>
